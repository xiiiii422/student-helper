name: iOS

# 没有 Mac 的开发闭环靠这条流水线：
#   1. 纯逻辑（排版 / SSE / 提示词 / 批改解析 / zip 备份）在 Linux 容器里跑 swift test —— 不花 macOS 额度
#   2. 界面在 macOS runner 的无头 iPhone 14 模拟器里逐屏截图，产物回传，我读图判断
#   3. 需要装机时才跑 ipa job
# 因为私有仓的 macOS 分钟按 10 倍计费，push 不触发 screens/ipa，只有手动或打 tag 才跑。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "跑哪个任务"
        required: false
        default: ipa
        type: choice
        options:
          - ipa
          - screens
          - all
      screens:
        description: 要截的界面，空格分隔；all 表示全部
        required: false
        default: all
      appearance:
        description: "模拟器外观（light / dark）"
        required: false
        default: light
        type: choice
        options:
          - light
          - dark
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: StudentHelper
  BUNDLE_ID: com.example.studenthelper

jobs:
  # ───────────────────────── 纯逻辑：Linux，免费 ─────────────────────────
  core-tests:
    name: 核心逻辑单测 (Linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Core
        run: swift test --parallel

  # ───────────────────────── 界面：macOS 模拟器截图 ─────────────────────────
  screens:
    name: iPhone 14 模拟器截图
    # macos-14 镜像将于 2026-11-02 退役，改用 macos-15（Xcode 16 / iOS 18 SDK，
    # 支持 iOS 16 部署目标）。见 github.blog/changelog/2026-10-01-...-retirement
    runs-on: macos-15
    # 截图依赖逻辑层已经跑通，所以保留 needs；但 ipa 不依赖单测（见下），
    # 否则一个单测标题写错就把装机包也挡住了。
    needs: core-tests
    if: (github.event_name == 'workflow_dispatch' && inputs.target != 'ipa') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ios-screens]'))
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建模拟器包
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -project StudentHelper.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            GLM_API_KEY="${{ secrets.GLM_API_KEY }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            DEFAULT_PROVIDER="${{ secrets.DEFAULT_PROVIDER }}" \
            | tail -40

      - name: 启动模拟器并逐屏截图
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devs in sorted(data['devices'].items()):
              if 'iOS' not in runtime: continue
              for d in devs:
                  if d['name'] == 'iPhone 14':
                      print(d['udid']); sys.exit()
          for runtime, devs in sorted(data['devices'].items()):
              if 'iOS' not in runtime: continue
              for d in devs:
                  if d['isAvailable']:
                      print(d['udid']); sys.exit()
          sys.exit('没有可用的 iOS 模拟器')
          ")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          # 必须等设备真正启动完成，否则紧接着的 ui appearance 会静默失效
          # （上一轮就是这么截出一批和浅色一模一样的"深色图"）。
          xcrun simctl bootstatus "$UDID" -b
          # 外观：截深色图时先切过去，否则截到的还是浅色
          TARGET_APPEARANCE="${{ github.event.inputs.appearance || 'light' }}"
          [ "$TARGET_APPEARANCE" = "dark" ] && TARGET_APPEARANCE=dark || TARGET_APPEARANCE=light
          xcrun simctl ui "$UDID" appearance "$TARGET_APPEARANCE"
          echo "当前模拟器外观: $(xcrun simctl ui "$UDID" appearance)"
          # 状态栏时间固定，避免两次截图只因分钟数不同就被判成回归
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 \
            --wifiBars 3 --operatorName ""

          APP="ios/dd/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          if [ ! -d "$APP" ]; then echo "找不到构建产物 $APP"; exit 1; fi
          xcrun simctl install "$UDID" "$APP"

          mkdir -p shots
          REQUESTED="${{ github.event.inputs.screens || 'all' }}"
          if [ "$REQUESTED" = "all" ]; then
            SCREENS="chatEmpty chatMath chatChinese chatEnglish compositionEmpty compositionDetail favorites settings me essay"
          else
            SCREENS="$REQUESTED"
          fi

          for name in $SCREENS; do
            echo "=== $name ==="
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            # 主题也从启动参数注入：浅色/深色都走同一条确定性路径，不依赖模拟器外观
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -uiTestScreen "$name" -uiTestTheme "$TARGET_APPEARANCE"
            # KaTeX 是异步渲染 + 两次量高，给足时间否则截到半成品
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          done

      - name: 上传截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone14-screens-${{ github.event.inputs.appearance || 'light' }}
          path: shots/*.png
          if-no-files-found: error

  # ───────────────────────── 装机包 ─────────────────────────
  ipa:
    name: 构建 ipa
    runs-on: macos-15
    # 刻意不写 needs: core-tests —— 能否构建出包 与 单测是否全绿 是两件事，
    # 把两者串起来会让"只是某个文案断言挂了"把装机路径整个堵死。
    if: (github.event_name == 'workflow_dispatch' && inputs.target != 'screens') || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: 生成工程
        working-directory: ios
        run: |
          # macOS runner 自带 Homebrew；此前这里引用了一个不存在的 action
          # （oven-sh/setup-brew@v1），会让整个 job 在第一步就失败。
          [ -x "$(command -v xcodegen)" ] || brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: 无签名构建（自用侧载：由 Sideloadly/AltServer 在本地签名）
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -project StudentHelper.xcodeproj -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./dd \
            CODE_SIGNING_ALLOWED=NO \
            GLM_API_KEY="${{ secrets.GLM_API_KEY }}" \
            DEEPSEEK_API_KEY="${{ secrets.DEEPSEEK_API_KEY }}" \
            DEFAULT_PROVIDER="${{ secrets.DEFAULT_PROVIDER }}"
          mkdir -p out/Payload
          cp -R dd/Build/Products/Release-iphoneos/$SCHEME.app out/Payload/
          (cd out && zip -qr "$SCHEME-unsigned.ipa" Payload)
          mv out/$SCHEME-unsigned.ipa ./
          ls -lh $SCHEME-unsigned.ipa
          # 顺手验证 API Key 真的被注进 Info.plist 了（没注入的话装上也调不通模型）
          KEY=$(/usr/libexec/PlistBuddy -c "Print :GLMApiKey" \
            "dd/Build/Products/Release-iphoneos/$SCHEME.app/Info.plist" 2>/dev/null || true)
          if [ -z "$KEY" ]; then echo "::error::Info.plist 里 GLMApiKey 为空，检查仓库 Secrets"; exit 1; fi
          echo "GLMApiKey 已注入，长度 ${#KEY}"

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ipa
          # 注意：这个 job 的 working-directory 是 ios/，产物也在 ios/ 下。
          # 之前写成 "StudentHelper-unsigned.ipa"（相对仓库根），结果只打了一条
          # warning 就“成功”了，产物其实是空的。
          path: ios/${{ env.SCHEME }}-unsigned.ipa
          if-no-files-found: error
