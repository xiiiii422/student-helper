activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
retrofit = "2.11.0"
okhttp = "4.12.0"
okhttpLogging = "4.12.0"
retrofitSerialization = "1.0.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
mlkitChinese = "16.0.1"
cameraX = "1.4.1"
coil = "2.7.0"
accompanist = "0.36.0"
webkit = "1.12.1"
